  <path d="M60 48 Q68 44 74 48" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M60 58 Q52 54 46 58" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M60 68 Q68 64 74 68" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Golden Core Pearl -->
  <circle cx="60" cy="40" r="4.5" fill="url(#goldGrad)"/>
</svg>
